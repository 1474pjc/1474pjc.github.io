<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Listing Removed — Privacy Notice</title>
  <meta name="description" content="This listing has been removed to protect the privacy of the new owner. Use the form below to get help building a real estate page for yourself." />
  <meta name="theme-color" content="#fff7f0" />
  <style>
    :root{ --bg:#fff7f0; --card:#fff; --ink:#1b1b1b; --muted:#6f6f6f; --accent:#7aa27a }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial;color:var(--ink);display:flex;align-items:center;justify-content:center}
    .card{max-width:720px;width:92%;background:var(--card);border-radius:16px;padding:36px;box-shadow:0 12px 40px rgba(22,22,22,.08);text-align:center}
    .emoji{font-size:56px;margin-bottom:8px}
    h1{margin:8px 0 6px;font-size:28px}
    p{color:var(--muted);line-height:1.5;margin:10px 0}
    form{margin-top:18px;display:grid;gap:10px}
    label{display:block;text-align:left;font-size:13px;color:var(--muted);font-weight:600}
    input,textarea,select{width:100%;padding:10px 12px;border:1px solid #ececec;border-radius:8px;font-size:15px}
    textarea{min-height:110px;resize:vertical}
    .row{display:flex;gap:10px}
    .row > *{flex:1}
    button{background:var(--accent);color:white;padding:10px 14px;border-radius:8px;border:0;font-weight:700;cursor:pointer}
    footer{margin-top:16px;font-size:13px;color:var(--muted)}
    a{color:var(--accent)}
  </style>
</head>
<body>
  <main class="card" role="main">
    <div class="emoji" aria-hidden="true">🏡✨</div>
    <h1>Listing Removed for Privacy</h1>
    <p>If you were here to view the brochure for this home, we have taken it down to protect the privacy of the new owner.</p>
    <p>If you'd like help creating a beautiful real estate page for your own home, please reach out using the comment box below — the form still works.</p>

    <form id="contact-form" action="https://formspree.io/f/mbdbbwlo" method="POST">
      <div class="row">
        <div>
          <label for="name">Name</label>
          <input id="name" name="name" type="text" placeholder="Your name" required />
        </div>
        <div>
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="you@example.com" required />
        </div>
      </div>
      <div>
        <label for="message">Comment / Project Details</label>
        <textarea id="message" name="message" placeholder="Tell us about the page you want..." required></textarea>
      </div>
      <div style="display:flex;gap:8px;align-items:center;justify-content:center;margin-top:6px">
        <button type="submit">Send Message</button>
      </div>
      <p id="status" style="display:none;font-size:13px;color:var(--muted);margin-top:8px"></p>
    </form>

    <footer></footer>
  </main>

  <script>
    const form = document.getElementById('contact-form');
    const status = document.getElementById('status');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      status.style.display = 'none';
      const btn = form.querySelector('button');
      btn.disabled = true; btn.textContent = 'Sending…';
      try{
        const res = await fetch(form.action, { method:'POST', body: new FormData(form), headers:{'Accept':'application/json'} });
        if(res.ok){ status.textContent = 'Thanks — we received your message.'; status.style.color = 'green'; status.style.display = 'block'; form.reset(); }
        else throw new Error('Network error');
      }catch(err){ status.textContent = 'Something went wrong — please try again later.'; status.style.color = 'crimson'; status.style.display = 'block'; }
      btn.disabled = false; btn.textContent = 'Send Message';
    });
  </script>
</body>
</html>
